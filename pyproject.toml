[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tmdl-drift-doctor"
version = "0.1.0"
description = "Drift detection and auto-remediation for fleets of TMDL-format Power BI semantic models derived from a shared template."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Christoforos Kapsalis" }]
requires-python = ">=3.10"
keywords = ["power-bi", "tmdl", "semantic-model", "drift", "remediation", "fleet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
drift-doctor = "tmdl_drift_doctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tmdl_drift_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
